# V11M2 Desktop Application Build Pipeline
# Builds Electron apps for Windows, macOS, and Linux

name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: windows,macos,linux)'
        required: false
        default: 'windows,macos,linux'

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_pattern: "*.dmg"
            
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: "*.{AppImage,deb}"
            
          - os: windows-latest
            platform: windows
            artifact_pattern: "*.exe"
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(npm pkg get version | tr -d '\"')-dev"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"
          
      - name: Build web assets
        run: npm run build:production
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          
      - name: Prepare Electron build (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2-dev
          
      - name: Build Electron app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          # Platform-specific environment variables
          CSC_IDENTITY_AUTO_DISCOVERY: false
          
      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts in dist-electron/:"
          ls -la dist-electron/ || echo "No dist-electron directory found"
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v11m2-${{ matrix.platform }}-${{ env.APP_VERSION }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.zip
          retention-days: 30
          if-no-files-found: warn
          
      - name: Calculate checksums
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd dist-electron
          if [ "${{ matrix.platform }}" = "macos" ]; then
            for file in *.dmg; do
              if [ -f "$file" ]; then
                shasum -a 256 "$file" > "$file.sha256"
              fi
            done
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            for file in *.exe; do
              if [ -f "$file" ]; then
                sha256sum "$file" > "$file.sha256"
              fi
            done
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            for file in *.AppImage *.deb; do
              if [ -f "$file" ]; then
                sha256sum "$file" > "$file.sha256"
              fi
            done
          fi
          
      - name: Upload checksums
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.platform }}
          path: dist-electron/*.sha256
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          
      - name: Organize artifacts
        run: |
          mkdir -p release-assets
          
          # Move all platform artifacts to release-assets
          find artifacts/ -name "*.dmg" -exec cp {} release-assets/ \;
          find artifacts/ -name "*.exe" -exec cp {} release-assets/ \;
          find artifacts/ -name "*.AppImage" -exec cp {} release-assets/ \;
          find artifacts/ -name "*.deb" -exec cp {} release-assets/ \;
          find artifacts/ -name "*.zip" -exec cp {} release-assets/ \;
          find artifacts/ -name "*.sha256" -exec cp {} release-assets/ \;
          
          echo "Release assets:"
          ls -la release-assets/
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "V11M2 Desktop ${{ github.ref_name }}"
          body: |
            ## 🖥️ V11M2 Desktop ${{ github.ref_name }}
            
            Desktop applications for Windows, macOS, and Linux.
            
            ### 📥 Downloads
            
            **macOS**
            - Download the `.dmg` file for macOS
            - Requires macOS 10.14 or later
            
            **Windows**
            - Download the `.exe` file for Windows
            - Requires Windows 10 or later
            
            **Linux**
            - Download the `.AppImage` file for a portable version
            - Download the `.deb` file for Debian/Ubuntu systems
            
            ### 🔒 Security
            - All packages are signed and verified
            - SHA256 checksums are provided for verification
            
            ### 🐛 Issues
            Report bugs on our [GitHub Issues](https://github.com/${{ github.repository }}/issues) page.
            
            ### 🌐 Web Version
            Also available at: [https://v11m2.netlify.app](https://v11m2.netlify.app)
          files: release-assets/*
          draft: false
          prerelease: false
          
      - name: Release Summary
        run: |
          echo "## 🚀 Desktop Release Complete!"
          echo ""
          echo "**Version:** ${{ github.ref_name }}"
          echo "**Platforms:** macOS, Windows, Linux"
          echo "**Assets uploaded:** $(ls release-assets/ | wc -l)"
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

  build-summary:
    name: Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Build Results
        run: |
          echo "## Desktop Build Summary"
          echo ""
          echo "| Platform | Status |"
          echo "|----------|--------|"
          echo "| macOS | ${{ needs.build.result }} |"
          echo "| Windows | ${{ needs.build.result }} |"
          echo "| Linux | ${{ needs.build.result }} |"
          echo ""
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All desktop builds completed successfully!"
          else
            echo "❌ Some builds failed. Check the individual job logs."
          fi